# Shared security headers, included in every location.
#
# nginx drops inherited `add_header` directives in any location that declares
# its own, so these must be included explicitly wherever Cache-Control is set.
#
# NOTE: X-Frame-Options / CSP frame-ancestors are intentionally NOT set here.
# We allow framing on purpose so the SPA can detect a portal iframe and escape
# it (escapeEmbeddedContext in src/view/participant/auth/authDiagnostics.ts).
# Blocking frames would make the browser refuse to load the page inside the
# school portal — the escape script would never run and users would see a blank
# frame instead of being redirected to the survey.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
